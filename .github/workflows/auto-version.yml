name: Auto-version

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

# One bump at a time: two pushes to main racing here would compute the same
# next version and one of them would push an orphan tag.
concurrency:
  group: auto-version
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    # Skip if the push was from this action (avoid infinite loop)
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !startsWith(github.event.head_commit.message, 'chore: release')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current version and compute next
        id: version
        run: |
          CURRENT=$(grep -o '"version": *"[^"]*"' package.json | head -1 | cut -d'"' -f4)
          echo "current=$CURRENT"

          # Extract base version and pre-release counter
          # e.g. 0.1.0-alpha.2 → base=0.1.0-alpha counter=2
          if [[ "$CURRENT" =~ ^(.+)\.([0-9]+)$ ]]; then
            BASE="${BASH_REMATCH[1]}"
            COUNTER="${BASH_REMATCH[2]}"
            NEXT="${BASE}.$((COUNTER + 1))"
          else
            # No counter yet, start at .1
            NEXT="${CURRENT}.1"
          fi

          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Bumping $CURRENT → $NEXT"

      - name: Check if tag already exists
        id: check
        run: |
          TAG="v${{ steps.version.outputs.next }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version in package.json
        if: steps.check.outputs.exists == 'false'
        run: |
          NEXT="${{ steps.version.outputs.next }}"
          sed -i "s/\"version\": *\"[^\"]*\"/\"version\": \"$NEXT\"/" package.json

      - name: Commit and tag
        if: steps.check.outputs.exists == 'false'
        run: |
          NEXT="${{ steps.version.outputs.next }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore: bump version to $NEXT [skip ci]"
          git tag "v$NEXT"
          # Push the commit and the tag atomically so a push rejected by a
          # concurrent commit cannot leave a tag pointing at an unpushed commit.
          git push --atomic origin main "refs/tags/v$NEXT"

      # A tag pushed with GITHUB_TOKEN never fires `on: push: tags` workflows
      # (and the commit carries [skip ci]), so start the release explicitly.
      # workflow_dispatch is one of the events GITHUB_TOKEN may trigger.
      - name: Start the release build for the new tag
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref "v${{ steps.version.outputs.next }}"
